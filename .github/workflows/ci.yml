# NOVA continuous integration.
#
#   lint → typecheck → unit tests → build → integration tests → (staging deploy)
#
# Production deployment requires a manual approval step (see docs/09-deployment.md); nothing
# here can push to production on its own.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm --filter @nova/api exec prisma generate

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test:unit

  integration:
    name: Integration and end-to-end tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nova:nova@localhost:5432/nova_test?schema=public
      TEST_DATABASE_URL: postgresql://nova:nova@localhost:5432/nova_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-integration-secret-with-enough-length-0123456789
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Apply migrations
        run: pnpm --filter @nova/api exec prisma migrate deploy

      - name: Seed reference and demo data
        run: pnpm --filter @nova/api db:seed

      - name: Build the API
        run: pnpm --filter @nova/api build

      - name: Integration and end-to-end tests
        run: pnpm --filter @nova/api test:integration

  mobile:
    name: Mobile bundle
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      # Bundling catches what typechecking cannot: a module the bundler cannot resolve.
      - name: Export the web bundle
        run: pnpm --filter @nova/mobile exec expo export --platform web --output-dir dist

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [integration, mobile]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "Staging deployment runs here (see docs/09-deployment.md)."
          echo "Production requires the manual approval configured on the 'production' environment."
